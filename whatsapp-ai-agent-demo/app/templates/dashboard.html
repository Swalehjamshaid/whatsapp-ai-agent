<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haier Dashboard Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

h2{
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    text-align:center;
}

.card h3{
    margin:0;
    color:#666;
    font-size:15px;
}

.value{
    font-size:32px;
    font-weight:bold;
    color:#1565c0;
    margin-top:15px;
}

button{
    padding:12px 25px;
    margin-top:30px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2>Haier Logistics Dashboard Test</h2>

<button onclick="loadDashboard()">
Refresh Dashboard
</button>

<div class="grid">

<div class="card">
<h3>Total DNs</h3>
<div class="value" id="total_dn">-</div>
</div>

<div class="card">
<h3>Total Units</h3>
<div class="value" id="total_units">-</div>
</div>

<div class="card">
<h3>Total Revenue</h3>
<div class="value" id="total_value">-</div>
</div>

<div class="card">
<h3>PGI %</h3>
<div class="value" id="pgi">-</div>
</div>

<div class="card">
<h3>Delivery %</h3>
<div class="value" id="delivery">-</div>
</div>

<div class="card">
<h3>POD %</h3>
<div class="value" id="pod">-</div>
</div>

<div class="card">
<h3>Pending DNs</h3>
<div class="value" id="pending_dn">-</div>
</div>

<div class="card">
<h3>Pending Units</h3>
<div class="value" id="pending_units">-</div>
</div>

</div>

</div>

<script>

const API_URL="YOUR_N8N_WEBHOOK_URL";

async function loadDashboard(){

    try{

        const response=await fetch(API_URL);

        const result=await response.json();

        const data=result.data[0];

        document.getElementById("total_dn").innerHTML=data.total_dn;

        document.getElementById("total_units").innerHTML=data.total_units;

        document.getElementById("total_value").innerHTML=
            Number(data.total_value).toLocaleString();

        document.getElementById("pgi").innerHTML=
            data.pgi_achievement+"%";

        document.getElementById("delivery").innerHTML=
            data.delivery_achievement+"%";

        document.getElementById("pod").innerHTML=
            data.pod_achievement+"%";

        document.getElementById("pending_dn").innerHTML=
            data.pending_dn;

        document.getElementById("pending_units").innerHTML=
            data.pending_units;

    }
    catch(error){

        alert("Unable to load dashboard");

        console.log(error);

    }

}

loadDashboard();

</script>

</body>
</html>
