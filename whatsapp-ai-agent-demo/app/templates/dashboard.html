<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Logistics Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0}
header{background:#005baa;color:#fff;padding:16px;text-align:center}
.container{padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:#fff;border-radius:8px;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.card h4{margin:0;color:#666;font-size:14px}
.card h2{margin:8px 0;color:#005baa}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;font-size:13px}
th{background:#005baa;color:#fff;position:sticky;top:0}
canvas{background:#fff;margin-top:20px;padding:10px}
</style>
</head>
<body>
<header><h1>Haier Logistics Intelligence Dashboard</h1></header>
<div class="container">
<div class="cards" id="cards"></div>
<canvas id="revenueChart" height="100"></canvas>
<table>
<thead>
<tr>
<th>Rank</th><th>Warehouse</th><th>Revenue</th><th>DNs</th><th>Units</th><th>Dealers</th><th>Delivery %</th><th>POD %</th>
</tr>
</thead>
<tbody id="warehouseBody"></tbody>
</table>
</div>
<script>
const API="http://127.0.0.1:5678/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadDashboard(){
 const res=await fetch(API);
 const data=await res.json();
 const e=data.executive;
 const metrics=[
 ["Delivery Notes",e.total_delivery_notes],
 ["Units",e.total_dn_units],
 ["Revenue","PKR "+Number(e.total_revenue).toLocaleString()],
 ["Dealers",e.total_dealers],
 ["Cities",e.total_cities],
 ["Warehouses",e.total_warehouses],
 ["Products",e.total_products],
 ["Delivered DNs",e.delivered_dns],
 ["Pending DNs",e.pending_delivery_dns],
 ["Completed POD",e.completed_pod_dns],
 ["Health Score",e.logistics_health_score],
 ["Risk",e.risk_level]
 ];
 document.getElementById("cards").innerHTML=metrics.map(m=>`<div class='card'><h4>${m[0]}</h4><h2>${m[1]}</h2></div>`).join("");

 document.getElementById("warehouseBody").innerHTML=data.warehouses.map(w=>`
 <tr>
 <td>${w.rank}</td>
 <td>${w.warehouse}</td>
 <td>${Number(w.total_revenue).toLocaleString()}</td>
 <td>${w.total_delivery_notes}</td>
 <td>${w.total_units}</td>
 <td>${w.total_dealers}</td>
 <td>${w.delivery_achievement_pct}%</td>
 <td>${w.pod_achievement_pct}%</td>
 </tr>`).join("");

 new Chart(document.getElementById("revenueChart"),{
 type:"bar",
 data:{
 labels:data.warehouses.map(w=>w.warehouse),
 datasets:[{label:"Revenue",data:data.warehouses.map(w=>Number(w.total_revenue))}]
 }
 });
}
loadDashboard();
</script>
</body>
</html>
