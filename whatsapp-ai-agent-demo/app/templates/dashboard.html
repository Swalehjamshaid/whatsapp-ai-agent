<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haier Pakistan Logistics Dashboard</title>

<style>
body{
    font-family:Arial;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#003366;
    color:#fff;
    padding:20px;
    text-align:center;
    font-size:28px;
}

button{
    margin:20px;
    padding:12px 25px;
    background:#0066cc;
    color:#fff;
    border:none;
    cursor:pointer;
}

.cards{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:15px;
    margin:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 5px #ccc;
}

.card h3{
    color:#666;
}

.card h2{
    color:#0066cc;
}

table{
    width:96%;
    margin:auto;
    border-collapse:collapse;
    background:white;
}

th{
    background:#003366;
    color:white;
    padding:10px;
}

td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

pre{
    margin:20px;
    background:#222;
    color:#00ff00;
    padding:15px;
    max-height:300px;
    overflow:auto;
}
</style>

</head>

<body>

<header>Haier Pakistan Logistics Dashboard</header>

<button onclick="loadData()">Refresh Dashboard</button>

<div id="status"></div>

<div class="cards">

<div class="card">
<h3>Total Warehouses</h3>
<h2 id="w">0</h2>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h2 id="r">0</h2>
</div>

<div class="card">
<h3>Total Units</h3>
<h2 id="u">0</h2>
</div>

<div class="card">
<h3>Total DNs</h3>
<h2 id="d">0</h2>
</div>

<div class="card">
<h3>Health</h3>
<h2 id="h">0</h2>
</div>

<div class="card">
<h3>Risk</h3>
<h2 id="risk">-</h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Rank</th>

<th>Warehouse</th>

<th>Revenue</th>

<th>Units</th>

<th>DN</th>

<th>PGI %</th>

<th>Delivery %</th>

<th>POD %</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<pre id="json"></pre>

<script>

const API="http://localhost:5678/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadData(){

try{

const res=await fetch(API);

const data=await res.json();

document.getElementById("json").textContent=
JSON.stringify(data,null,2);

const e=data.executive;

document.getElementById("w").innerHTML=e.total_warehouses;

document.getElementById("r").innerHTML=
Number(e.total_revenue).toLocaleString();

document.getElementById("u").innerHTML=
Number(e.total_dn_units).toLocaleString();

document.getElementById("d").innerHTML=
Number(e.total_delivery_notes).toLocaleString();

document.getElementById("h").innerHTML=
e.logistics_health_score+"%";

document.getElementById("risk").innerHTML=
e.risk_level;

let html="";

for(const x of data.warehouses){

html+=`
<tr>
<td>${x.rank}</td>
<td>${x.warehouse}</td>
<td>${Number(x.total_revenue).toLocaleString()}</td>
<td>${Number(x.total_units).toLocaleString()}</td>
<td>${x.total_delivery_notes}</td>
<td>${x.pgi_achievement_pct}%</td>
<td>${x.delivery_achievement_pct}%</td>
<td>${x.pod_achievement_pct}%</td>
</tr>
`;

}

document.getElementById("tbody").innerHTML=html;

document.getElementById("status").innerHTML="<h3 style='color:green'>Connected Successfully</h3>";

}catch(err){

document.getElementById("status").innerHTML="<h3 style='color:red'>"+err+"</h3>";

console.log(err);

}

}

loadData();

</script>

</body>
</html>
