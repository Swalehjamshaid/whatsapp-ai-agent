<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Logistics Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
header{background:#1565c0;color:#fff;padding:18px;text-align:center}
.container{max-width:1300px;margin:20px auto;padding:0 20px}
.toolbar{text-align:right;margin-bottom:15px}
button{padding:10px 18px;border:none;background:#1565c0;color:#fff;border-radius:6px;cursor:pointer}
.status{font-weight:bold;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card h3{margin:0;color:#666;font-size:16px}
.value{margin-top:10px;font-size:30px;font-weight:bold;color:#1565c0}
table{width:100%;border-collapse:collapse;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-top:25px}
th,td{padding:10px;border:1px solid #ddd;text-align:center}
thead{background:#1565c0;color:#fff}
tbody tr:nth-child(even){background:#f8f8f8}
tbody tr:hover{background:#e8f1ff}
.good{color:#2e7d32;font-weight:bold}
.warn{color:#ef6c00;font-weight:bold}
.bad{color:#c62828;font-weight:bold}
</style>
</head>
<body>

<header>
<h2>Haier Logistics Enterprise Dashboard</h2>
</header>

<div class="container">

<div class="toolbar">
<button onclick="loadDashboard()">Refresh Dashboard</button>
</div>

<div class="status" id="status">Connecting...</div>

<div class="grid">

<div class="card"><h3>Total DNs</h3><div class="value" id="total_dn">-</div></div>
<div class="card"><h3>Total Units</h3><div class="value" id="total_units">-</div></div>
<div class="card"><h3>Total Revenue</h3><div class="value" id="total_value">-</div></div>
<div class="card"><h3>PGI %</h3><div class="value" id="pgi">-</div></div>
<div class="card"><h3>Delivery %</h3><div class="value" id="delivery">-</div></div>
<div class="card"><h3>POD %</h3><div class="value" id="pod">-</div></div>
<div class="card"><h3>Pending DNs</h3><div class="value" id="pending_dn">-</div></div>
<div class="card"><h3>Pending Units</h3><div class="value" id="pending_units">-</div></div>

</div>

<div id="warehouseTable"></div>

</div>

<script>
const API_URL="https://jamshaidkhan.app.n8n.cloud/webhook/haier-dashboard";

function health(score){
    score=Number(score);
    if(score>=90) return '<span class="good">'+score.toFixed(1)+'%</span>';
    if(score>=80) return '<span class="warn">'+score.toFixed(1)+'%</span>';
    return '<span class="bad">'+score.toFixed(1)+'%</span>';
}

function risk(units){
    units=Number(units);
    if(units<1000) return "Low";
    if(units<5000) return "Medium";
    return "High";
}

async function loadDashboard(){

document.getElementById("status").innerHTML="Loading...";

try{

const response=await fetch(API_URL);

if(!response.ok) throw new Error("HTTP "+response.status);

const result=await response.json();

if(!result.success) throw new Error(result.message);

const data=result.cards;
const warehouses=result.warehouse_ranking;

total_dn.innerHTML=Number(data.total_dn).toLocaleString();
total_units.innerHTML=Number(data.total_units).toLocaleString();
total_value.innerHTML=Number(data.total_value).toLocaleString();
pgi.innerHTML=data.pgi_achievement+"%";
delivery.innerHTML=data.delivery_achievement+"%";
pod.innerHTML=data.pod_achievement+"%";
pending_dn.innerHTML=Number(data.pending_dn).toLocaleString();
pending_units.innerHTML=Number(data.pending_units).toLocaleString();

let html=`
<h2>Warehouse Ranking</h2>
<table>
<thead>
<tr>
<th>Rank</th>
<th>Warehouse</th>
<th>DNs</th>
<th>Units</th>
<th>Revenue</th>
<th>PGI%</th>
<th>Delivery%</th>
<th>POD%</th>
<th>Health</th>
<th>Risk</th>
<th>Pending DNs</th>
<th>Pending Units</th>
</tr>
</thead>
<tbody>`;

warehouses.forEach((w,i)=>{
const hs=(Number(w.pgi_achievement)+Number(w.delivery_achievement)+Number(w.pod_achievement))/3;
html+=`
<tr>
<td>${i+1}</td>
<td>${w.warehouse}</td>
<td>${Number(w.total_dn).toLocaleString()}</td>
<td>${Number(w.total_units).toLocaleString()}</td>
<td>${Number(w.total_revenue).toLocaleString()}</td>
<td>${w.pgi_achievement}%</td>
<td>${w.delivery_achievement}%</td>
<td>${w.pod_achievement}%</td>
<td>${health(hs)}</td>
<td>${risk(w.pending_units)}</td>
<td>${Number(w.pending_dn).toLocaleString()}</td>
<td>${Number(w.pending_units).toLocaleString()}</td>
</tr>`;
});

html+="</tbody></table>";
document.getElementById("warehouseTable").innerHTML=html;
document.getElementById("status").innerHTML="✅ Connected Successfully";

}catch(e){
document.getElementById("status").innerHTML="❌ "+e.message;
console.error(e);
}
}

loadDashboard();
setInterval(loadDashboard,300000);
</script>

</body>
</html>
