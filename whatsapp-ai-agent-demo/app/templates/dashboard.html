<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Logistics Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:40px;
}
.container{
    max-width:1100px;
    margin:auto;
}
h2{
    text-align:center;
    color:#1565c0;
}
.status{
    text-align:center;
    margin:20px;
    font-weight:bold;
}
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}
.card{
    background:#fff;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
.card h3{
    margin:0;
    color:#666;
}
.value{
    font-size:32px;
    font-weight:bold;
    color:#1565c0;
    margin-top:15px;
}
button{
    padding:12px 25px;
    cursor:pointer;
    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="container">

<h2>Haier Logistics Dashboard</h2>

<div style="text-align:center;">
<button onclick="loadDashboard()">Refresh Dashboard</button>
</div>

<div class="status" id="status">
Connecting to n8n...
</div>

<div class="grid">

<div class="card">
<h3>Total DNs</h3>
<div class="value" id="total_dn">-</div>
</div>

<div class="card">
<h3>Total Units</h3>
<div class="value" id="total_units">-</div>
</div>

<div class="card">
<h3>Total Revenue</h3>
<div class="value" id="total_value">-</div>
</div>

<div class="card">
<h3>PGI %</h3>
<div class="value" id="pgi">-</div>
</div>

<div class="card">
<h3>Delivery %</h3>
<div class="value" id="delivery">-</div>
</div>

<div class="card">
<h3>POD %</h3>
<div class="value" id="pod">-</div>
</div>

<div class="card">
<h3>Pending DNs</h3>
<div class="value" id="pending_dn">-</div>
</div>

<div class="card">
<h3>Pending Units</h3>
<div class="value" id="pending_units">-</div>
</div>

</div>

</div>

<script>

const API_URL = "https://jamshaidkhan.app.n8n.cloud/webhook/haier-dashboard";

async function loadDashboard(){

    document.getElementById("status").innerHTML="Loading...";

    try{

        const response = await fetch(API_URL,{
            method:"GET",
            headers:{
                "Accept":"application/json"
            }
        });

        console.log("HTTP Status:",response.status);

        if(!response.ok){
            throw new Error("HTTP "+response.status);
        }

        const result = await response.json();

        console.log("API Response:",result);

        if(!result.success){
            throw new Error(result.message || "Unknown API Error");
        }

        const data=result.data[0];

        document.getElementById("total_dn").innerHTML=
            Number(data.total_dn).toLocaleString();

        document.getElementById("total_units").innerHTML=
            Number(data.total_units).toLocaleString();

        document.getElementById("total_value").innerHTML=
            Number(data.total_value).toLocaleString();

        document.getElementById("pgi").innerHTML=
            data.pgi_achievement+"%";

        document.getElementById("delivery").innerHTML=
            data.delivery_achievement+"%";

        document.getElementById("pod").innerHTML=
            data.pod_achievement+"%";

        document.getElementById("pending_dn").innerHTML=
            Number(data.pending_dn).toLocaleString();

        document.getElementById("pending_units").innerHTML=
            Number(data.pending_units).toLocaleString();

        document.getElementById("status").innerHTML=
            "✅ Connected Successfully";

    }

    catch(error){

        console.error(error);

        document.getElementById("status").innerHTML=
            "❌ "+error.message;

    }

}

loadDashboard();

</script>

</body>
</html>
