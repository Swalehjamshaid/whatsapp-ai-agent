<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Logistics Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
}

header{
    background:#003366;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:95%;
    margin:auto;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.card{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.card h3{
    margin:0;
    color:#555;
}

.card h2{
    margin-top:15px;
    color:#0070c0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:white;
}

th{
    background:#003366;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f2f2f2;
}

button{
    padding:10px 20px;
    background:#0070c0;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#005999;
}

</style>

</head>

<body>

<header>

<h1>Haier Pakistan Logistics Dashboard</h1>

</header>

<div class="container">

<button onclick="loadData()">Refresh Dashboard</button>

<div class="cards">

<div class="card">
<h3>Total Warehouses</h3>
<h2 id="warehouseCount">0</h2>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h2 id="revenue">0</h2>
</div>

<div class="card">
<h3>Total Units</h3>
<h2 id="units">0</h2>
</div>

<div class="card">
<h3>Total Delivery Notes</h3>
<h2 id="dns">0</h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Warehouse</th>
<th>Revenue</th>
<th>Units</th>
<th>DNs</th>
<th>PGI %</th>
<th>Delivery %</th>
<th>POD %</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

const API="http://localhost:5678/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadData(){

const response=await fetch(API);

const data=await response.json();

document.getElementById("warehouseCount").innerHTML=data.warehouses.length;

document.getElementById("revenue").innerHTML=
Number(data.executive.total_revenue).toLocaleString();

document.getElementById("units").innerHTML=
Number(data.executive.total_units).toLocaleString();

document.getElementById("dns").innerHTML=
Number(data.executive.total_dn).toLocaleString();

let html="";

data.warehouses.forEach(w=>{

html+=`

<tr>

<td>${w.warehouse}</td>

<td>${Number(w.total_revenue).toLocaleString()}</td>

<td>${Number(w.total_units).toLocaleString()}</td>

<td>${w.total_delivery_notes}</td>

<td>${w.pgi_achievement_pct}%</td>

<td>${w.delivery_achievement_pct}%</td>

<td>${w.pod_achievement_pct}%</td>

</tr>

`;

});

document.getElementById("tableBody").innerHTML=html;

}

loadData();

</script>

</body>

</html>
