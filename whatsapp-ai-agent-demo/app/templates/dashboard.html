<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Haier Logistics Dashboard Test</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#003366;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    margin:20px auto;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#004b99;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.card h3{
    margin:0;
    color:#666;
}

.card h2{
    color:#0070c0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:white;
}

th{
    background:#003366;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.status{
    margin-top:20px;
    padding:15px;
    border-radius:6px;
    font-weight:bold;
}

.success{
    background:#d4edda;
    color:#155724;
}

.error{
    background:#f8d7da;
    color:#721c24;
}

pre{
    background:#222;
    color:#0f0;
    padding:15px;
    overflow:auto;
    max-height:300px;
    border-radius:6px;
}

</style>

</head>

<body>

<header>

<h1>Haier Pakistan Logistics Dashboard</h1>

</header>

<div class="container">

<button onclick="loadData()">
Refresh Dashboard
</button>

<div id="status"></div>

<div class="cards">

<div class="card">
<h3>Total Warehouses</h3>
<h2 id="warehouseCount">0</h2>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h2 id="revenue">0</h2>
</div>

<div class="card">
<h3>Total Units</h3>
<h2 id="units">0</h2>
</div>

<div class="card">
<h3>Total Delivery Notes</h3>
<h2 id="dns">0</h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Warehouse</th>
<th>Revenue</th>
<th>Units</th>
<th>DNs</th>
<th>PGI %</th>
<th>Delivery %</th>
<th>POD %</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<h2>Webhook JSON Response</h2>

<pre id="jsonOutput">
Waiting...
</pre>

</div>

<script>

// =====================================================
// REPLACE THIS URL
// =====================================================

const API =
"https://YOUR-CLOUDFLARE-URL.trycloudflare.com/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadData(){

const status=document.getElementById("status");

status.innerHTML="Loading...";

status.className="status";

try{

const response=await fetch(API);

if(!response.ok){

throw new Error("HTTP "+response.status);

}

const data=await response.json();

document.getElementById("jsonOutput").textContent=
JSON.stringify(data,null,4);

status.innerHTML="✅ Connected Successfully";

status.className="status success";

document.getElementById("warehouseCount").innerHTML=
data.warehouses.length;

document.getElementById("revenue").innerHTML=
Number(data.executive.total_revenue).toLocaleString();

document.getElementById("units").innerHTML=
Number(data.executive.total_units).toLocaleString();

document.getElementById("dns").innerHTML=
Number(data.executive.total_dn).toLocaleString();

let html="";

data.warehouses.forEach(w=>{

html+=`

<tr>

<td>${w.warehouse}</td>

<td>${Number(w.total_revenue).toLocaleString()}</td>

<td>${Number(w.total_units).toLocaleString()}</td>

<td>${w.total_delivery_notes}</td>

<td>${w.pgi_achievement_pct}%</td>

<td>${w.delivery_achievement_pct}%</td>

<td>${w.pod_achievement_pct}%</td>

</tr>

`;

});

document.getElementById("tableBody").innerHTML=html;

}

catch(error){

status.innerHTML="❌ "+error.message;

status.className="status error";

document.getElementById("jsonOutput").textContent=
error.stack;

console.error(error);

}

}

loadData();

</script>

</body>

</html>
