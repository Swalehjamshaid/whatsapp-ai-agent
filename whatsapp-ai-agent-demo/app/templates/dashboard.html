<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>n8n Integration Tester</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    margin:30px;
}

h1{
    color:#003366;
}

button{
    background:#0066cc;
    color:white;
    padding:12px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#004999;
}

.card{

    background:white;
    padding:15px;
    margin-top:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);

}

.success{

    color:green;
    font-weight:bold;

}

.error{

    color:red;
    font-weight:bold;

}

pre{

    background:#222;
    color:#00ff00;
    padding:15px;
    overflow:auto;
    max-height:350px;

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th{

background:#003366;
color:white;
padding:10px;

}

td{

padding:10px;
border:1px solid #ddd;

}

</style>

</head>

<body>

<h1>n8n Integration Tester</h1>

<button onclick="testWebhook()">

Test Integration

</button>

<div class="card">

<b>Webhook URL</b>

<p id="url"></p>

</div>

<div class="card">

<b>Status</b>

<p id="status">Waiting...</p>

</div>

<div class="card">

<b>HTTP Status</b>

<p id="httpStatus">-</p>

</div>

<div class="card">

<b>Response Time</b>

<p id="time">-</p>

</div>

<div class="card">

<b>Executive Summary</b>

<p>Total Warehouses :
<span id="warehouse">0</span></p>

<p>Total Revenue :
<span id="revenue">0</span></p>

<p>Total Units :
<span id="units">0</span></p>

<p>Total DNs :
<span id="dns">0</span></p>

</div>

<table>

<thead>

<tr>

<th>Warehouse</th>

<th>Revenue</th>

<th>Units</th>

<th>DN</th>

<th>PGI %</th>

<th>Delivery %</th>

<th>POD %</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

<div class="card">

<h3>Raw JSON</h3>

<pre id="json">

Waiting...

</pre>

</div>

<script>

//==============================
// CHANGE ONLY THIS
//==============================

const API =
"https://anymore-novelty-casey-civilian.trycloudflare.com/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

document.getElementById("url").innerHTML=API;

async function testWebhook(){

let start=performance.now();

try{

document.getElementById("status").innerHTML="Connecting...";

const response=await fetch(API);

document.getElementById("httpStatus").innerHTML=response.status;

const end=performance.now();

document.getElementById("time").innerHTML=
Math.round(end-start)+" ms";

if(!response.ok){

throw new Error(response.status);

}

const data=await response.json();

document.getElementById("status").innerHTML=
"<span class='success'>CONNECTED SUCCESSFULLY</span>";

document.getElementById("json").textContent=
JSON.stringify(data,null,4);

document.getElementById("warehouse").innerHTML=
data.warehouses.length;

document.getElementById("revenue").innerHTML=
Number(data.executive.total_revenue).toLocaleString();

document.getElementById("units").innerHTML=
Number(data.executive.total_units).toLocaleString();

document.getElementById("dns").innerHTML=
Number(data.executive.total_dn).toLocaleString();

let html="";

data.warehouses.forEach(w=>{

html+=`

<tr>

<td>${w.warehouse}</td>

<td>${Number(w.total_revenue).toLocaleString()}</td>

<td>${Number(w.total_units).toLocaleString()}</td>

<td>${w.total_delivery_notes}</td>

<td>${w.pgi_achievement_pct}%</td>

<td>${w.delivery_achievement_pct}%</td>

<td>${w.pod_achievement_pct}%</td>

</tr>

`;

});

document.getElementById("tbody").innerHTML=html;

}

catch(err){

document.getElementById("status").innerHTML=
"<span class='error'>FAILED</span>";

document.getElementById("json").textContent=
err.stack;

console.error(err);

}

}

testWebhook();

</script>

</body>

</html>
