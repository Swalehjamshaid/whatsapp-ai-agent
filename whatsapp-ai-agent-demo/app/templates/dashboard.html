<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>n8n API Test</title>

<style>
body{
    font-family:Arial;
    background:#f4f7fb;
    padding:30px;
}

button{
    padding:12px 30px;
    font-size:18px;
    cursor:pointer;
}

.card{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

pre{
    background:#111;
    color:#00ff88;
    padding:15px;
    overflow:auto;
    height:450px;
}
</style>

</head>

<body>

<h1>n8n Dashboard Integration Test</h1>

<button onclick="loadData()">Load Data</button>

<div class="card">
<h2>Executive KPI</h2>

<p>Total DN :
<span id="dn">0</span></p>

<p>Total Revenue :
<span id="revenue">0</span></p>

<p>Total Units :
<span id="units">0</span></p>

<p>Total Warehouses :
<span id="warehouse">0</span></p>

</div>

<h2>Raw JSON</h2>

<pre id="json"></pre>

<script>

const WEBHOOK =
"http://127.0.0.1:5678/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadData(){

try{

const response = await fetch(WEBHOOK);

const data = await response.json();

console.log(data);

document.getElementById("json").textContent =
JSON.stringify(data,null,2);

const executive=data.executive;

document.getElementById("dn").innerHTML=
executive.total_delivery_notes;

document.getElementById("revenue").innerHTML=
Number(executive.total_revenue).toLocaleString();

document.getElementById("units").innerHTML=
Number(executive.total_dn_units).toLocaleString();

document.getElementById("warehouse").innerHTML=
executive.total_warehouses;

}
catch(err){

alert(err);

console.log(err);

}

}

loadData();

</script>

</body>
</html>
