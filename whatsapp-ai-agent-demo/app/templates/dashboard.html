<script>

const API = "http://localhost:5678/webhook/5ccbda50-2b2f-4f46-9ddf-762e542f18f7";

async function loadDashboard() {

    try {

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("API Response:", data);

        // Supports both:
        // [{...}]
        // {...}
        let kpi = Array.isArray(data) ? data[0] : data;

        if (!kpi) {
            console.error("No KPI data received");
            return;
        }

        setValue("total_dn_created", kpi.total_dn_created);
        setValue("total_units_created", kpi.total_units_created);
        setValue("total_pgi_made", kpi.total_pgi_made);
        setValue("total_dn_delivered", kpi.total_dn_delivered);
        setValue("pending_delivery_dn", kpi.pending_delivery_dn);
        setValue("pending_delivery_qty", kpi.pending_delivery_qty);
        setValue("pending_pod_dn", kpi.pending_pod_dn);
        setValue("pending_pod_qty", kpi.pending_pod_qty);

    }
    catch (err) {

        console.error("Dashboard Error:", err);

    }

}

function setValue(id, value) {

    document.getElementById(id).innerHTML =
        Number(value || 0).toLocaleString();

}

loadDashboard();

setInterval(loadDashboard,30000);

</script>
