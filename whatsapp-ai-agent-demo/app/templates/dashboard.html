<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Logistics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
}

header{
    background:#005BAC;
    color:white;
    padding:15px 30px;
}

.container{
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h4{
    margin:0;
    color:#666;
}

.card h2{
    margin-top:10px;
    color:#005BAC;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:30px;
}

th{
    background:#005BAC;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

canvas{
    margin-top:30px;
    background:white;
    padding:20px;
}

button{
    background:#005BAC;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

</style>

</head>

<body>

<header>

<h1>Haier Pakistan Logistics Dashboard</h1>

<button onclick="loadDashboard()">
Refresh Dashboard
</button>

</header>

<div class="container">

<div class="cards">

<div class="card">
<h4>Total Delivery Notes</h4>
<h2 id="totalDN">0</h2>
</div>

<div class="card">
<h4>Total Units</h4>
<h2 id="totalUnits">0</h2>
</div>

<div class="card">
<h4>Total Revenue</h4>
<h2 id="totalRevenue">0</h2>
</div>

<div class="card">
<h4>PGI %</h4>
<h2 id="pgi">0%</h2>
</div>

<div class="card">
<h4>Delivery %</h4>
<h2 id="delivery">0%</h2>
</div>

<div class="card">
<h4>POD %</h4>
<h2 id="pod">0%</h2>
</div>

</div>

<canvas id="revenueChart"></canvas>

<table>

<thead>

<tr>

<th>Warehouse</th>

<th>DN</th>

<th>Units</th>

<th>Revenue</th>

<th>Health</th>

<th>Risk</th>

</tr>

</thead>

<tbody id="warehouseTable">

</tbody>

</table>

</div>

<script>

const API =
"https://jamshaidkhan.app.n8n.cloud/webhook/haier-dashboard";

let chart;

async function loadDashboard(){

const response = await fetch(API);

const data = await response.json();

const dashboard = Array.isArray(data) ? data[0] : data;

const cards = dashboard.cards;

document.getElementById("totalDN").innerText =
cards.total_delivery_notes.toLocaleString();

document.getElementById("totalUnits").innerText =
cards.total_units.toLocaleString();

document.getElementById("totalRevenue").innerText =
cards.total_revenue.toLocaleString();

document.getElementById("pgi").innerText =
cards.pgi_percentage+"%";

document.getElementById("delivery").innerText =
cards.delivery_percentage+"%";

document.getElementById("pod").innerText =
cards.pod_percentage+"%";

loadTable(dashboard.warehouse_ranking);

loadChart(dashboard.warehouse_ranking);

}

function loadTable(rows){

const tbody=document.getElementById("warehouseTable");

tbody.innerHTML="";

rows.forEach(r=>{

tbody.innerHTML+=`

<tr>

<td>${r.warehouse}</td>

<td>${r.total_dn}</td>

<td>${r.total_units}</td>

<td>${r.total_revenue}</td>

<td>${r.health_score}</td>

<td>${r.risk_level}</td>

</tr>

`;

});

}

function loadChart(rows){

const labels=rows.map(x=>x.warehouse);

const revenue=rows.map(x=>x.total_revenue);

if(chart){

chart.destroy();

}

chart=new Chart(

document.getElementById("revenueChart"),

{

type:"bar",

data:{

labels:labels,

datasets:[{

label:"Revenue",

data:revenue

}]

}

}

);

}

loadDashboard();

setInterval(loadDashboard,30000);

</script>

</body>

</html>
