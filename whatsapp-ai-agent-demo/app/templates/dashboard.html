<script>

const API = "http://localhost:5678/webhook/5ccbda50-2b2f-4f46-9ddf-762e542f18f7";

function setValue(id, value) {
    document.getElementById(id).textContent =
        value ?? 0;
}

async function loadDashboard() {

    const status = document.getElementById("status");

    try {

        status.textContent = "Loading...";

        const response = await fetch(API);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log(data);

        setValue("total_dn_created", data.total_dn_created);
        setValue("total_units_created", data.total_units_created);
        setValue("total_pgi_made", data.total_pgi_made);
        setValue("total_dn_delivered", data.total_dn_delivered);
        setValue("pending_delivery_dn", data.pending_delivery_dn);
        setValue("pending_delivery_qty", data.pending_delivery_qty);
        setValue("pending_pod_dn", data.pending_pod_dn);
        setValue("pending_pod_qty", data.pending_pod_qty);

        status.textContent =
            "Last Updated: " + new Date().toLocaleTimeString();

    }
    catch (err) {

        console.error(err);

        status.innerHTML =
            "<span class='error'>" + err.message + "</span>";
    }
}

loadDashboard();

setInterval(loadDashboard, 30000);

</script>
