<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haier Pakistan Logistics Dashboard</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#004a99;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h3{
    margin:0;
    color:#666;
    font-size:14px;
}

.card h2{
    margin-top:10px;
    color:#004a99;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th{
    background:#004a99;
    color:#fff;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

</style>

</head>

<body>

<h1>Haier Pakistan Logistics Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Delivery Notes</h3>
<h2 id="dn">0</h2>
</div>

<div class="card">
<h3>Total Units</h3>
<h2 id="units">0</h2>
</div>

<div class="card">
<h3>Total Revenue</h3>
<h2 id="revenue">0</h2>
</div>

<div class="card">
<h3>PGI %</h3>
<h2 id="pgi">0%</h2>
</div>

<div class="card">
<h3>Delivery %</h3>
<h2 id="delivery">0%</h2>
</div>

<div class="card">
<h3>POD %</h3>
<h2 id="pod">0%</h2>
</div>

<div class="card">
<h3>Pending DNs</h3>
<h2 id="pendingdn">0</h2>
</div>

<div class="card">
<h3>Pending Units</h3>
<h2 id="pendingunits">0</h2>
</div>

</div>

<table>

<thead>

<tr>
<th>Warehouse</th>
<th>DN</th>
<th>Units</th>
<th>Revenue</th>
<th>POD %</th>
<th>Pending DN</th>
<th>Pending Units</th>
<th>Risk</th>
</tr>

</thead>

<tbody id="warehouseTable"></tbody>

</table>

<script>

const API="YOUR_N8N_WEBHOOK_URL";

async function loadDashboard(){

const response=await fetch(API);

const result=await response.json();

const cards=result.cards;

document.getElementById("dn").innerText=Number(cards.total_delivery_notes).toLocaleString();

document.getElementById("units").innerText=Number(cards.total_units).toLocaleString();

document.getElementById("revenue").innerText="PKR "+Number(cards.total_revenue).toLocaleString();

document.getElementById("pgi").innerText=cards.pgi_percentage+"%";

document.getElementById("delivery").innerText=cards.delivery_percentage+"%";

document.getElementById("pod").innerText=cards.pod_percentage+"%";

document.getElementById("pendingdn").innerText=Number(cards.pending_dns).toLocaleString();

document.getElementById("pendingunits").innerText=Number(cards.pending_units).toLocaleString();

let html="";

result.warehouse_ranking.forEach(w=>{

html+=`
<tr>
<td>${w.warehouse}</td>
<td>${Number(w.total_dn).toLocaleString()}</td>
<td>${Number(w.total_units).toLocaleString()}</td>
<td>PKR ${Number(w.total_revenue).toLocaleString()}</td>
<td>${w.pod_achievement}%</td>
<td>${Number(w.pending_dn).toLocaleString()}</td>
<td>${Number(w.pending_units).toLocaleString()}</td>
<td>${w.risk_level}</td>
</tr>
`;

});

document.getElementById("warehouseTable").innerHTML=html;

}

loadDashboard();

setInterval(loadDashboard,30000);

</script>

</body>
</html>
