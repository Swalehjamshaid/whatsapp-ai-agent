<script>

const API = "https://anymore-novelty-casey-civilian.trycloudflare.com/webhook/b8501db8-e0ec-4bcd-8e0c-b2d3ebe87a8c";

async function loadData() {

    const status = document.getElementById("status");
    const tableBody = document.getElementById("tableBody");

    status.className = "status";
    status.innerHTML = "Loading Dashboard...";

    tableBody.innerHTML = "";

    try {

        const controller = new AbortController();

        const timeout = setTimeout(() => controller.abort(), 15000);

        const response = await fetch(API, {
            method: "GET",
            mode: "cors",
            cache: "no-cache",
            headers: {
                "Accept": "application/json"
            },
            signal: controller.signal
        });

        clearTimeout(timeout);

        if (!response.ok) {
            throw new Error("HTTP Error : " + response.status);
        }

        const data = await response.json();

        document.getElementById("jsonOutput").textContent =
            JSON.stringify(data, null, 4);

        if (!data.executive || !data.warehouses) {
            throw new Error("Invalid JSON returned from n8n.");
        }

        const e = data.executive;

        document.getElementById("warehouseCount").innerHTML =
            Number(e.total_warehouses).toLocaleString();

        document.getElementById("revenue").innerHTML =
            Number(e.total_revenue).toLocaleString();

        document.getElementById("units").innerHTML =
            Number(e.total_dn_units).toLocaleString();

        document.getElementById("dns").innerHTML =
            Number(e.total_delivery_notes).toLocaleString();

        document.getElementById("health").innerHTML =
            e.logistics_health_score + "%";

        document.getElementById("risk").innerHTML =
            e.risk_level;

        let html = "";

        data.warehouses.forEach(w => {

            html += `
            <tr>
                <td>${w.rank}</td>
                <td>${w.warehouse}</td>
                <td>${Number(w.total_revenue).toLocaleString()}</td>
                <td>${Number(w.total_units).toLocaleString()}</td>
                <td>${Number(w.total_delivery_notes).toLocaleString()}</td>
                <td>${w.pgi_achievement_pct}%</td>
                <td>${w.delivery_achievement_pct}%</td>
                <td>${w.pod_achievement_pct}%</td>
                <td>${w.logistics_health_score}%</td>
            </tr>
            `;

        });

        tableBody.innerHTML = html;

        status.className = "status success";
        status.innerHTML = "✅ Dashboard Connected Successfully";

    }

    catch (err) {

        status.className = "status error";

        if (err.name === "AbortError") {

            status.innerHTML = "Connection Timeout";

        } else {

            status.innerHTML = err.message;

        }

        document.getElementById("jsonOutput").textContent =
            err.stack || err.message;

        console.error(err);

    }

}

window.onload = loadData;

</script>
